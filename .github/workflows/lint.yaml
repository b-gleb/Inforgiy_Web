name: Code Quality

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    name: Run formatter & linter
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.5.15

      - name: Run Biome
        run: biome ci .